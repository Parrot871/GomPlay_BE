<!DOCTYPE html>
<html>
<head>
    <title>채팅 테스트</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.2/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <h2>곰플레이 채팅 테스트</h2>

    <div>
        <input type="text" id="roomId" placeholder="채팅방 ID" value="1"/>
        <input type="text" id="senderId" placeholder="보낸사람 ID" value="1"/>
        <input type="text" id="senderName" placeholder="보낸사람 이름" value="테스트"/>
        <button onclick="connect()">연결</button>
        <button onclick="disconnect()">연결 해제</button>
    </div>

    <div>
        <input type="text" id="message" placeholder="메시지 입력"/>
        <button onclick="sendMessage()">전송</button>
    </div>

    <div id="messages" style="border:1px solid black; height:300px; overflow-y:scroll; padding:10px;">
    </div>

    <script>
        let stompClient = null;

        function connect() {
            let socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function(frame) {
                console.log('연결됨: ' + frame);
                document.getElementById('messages').innerHTML += '<p style="color:green">연결 성공!</p>';

                stompClient.subscribe('/topic/chat/room', function(message) {
                    let msg = JSON.parse(message.body);
                    document.getElementById('messages').innerHTML +=
                        '<p><b>' + msg.senderName + '</b>: ' + msg.content + '</p>';
                });

                // 입장 메시지 전송
                stompClient.send("/pub/chat/message", {}, JSON.stringify({
                    type: 'ENTER',
                    roomId: document.getElementById('roomId').value,
                    senderId: document.getElementById('senderId').value,
                    senderName: document.getElementById('senderName').value,
                    content: ''
                }));
            });
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
                document.getElementById('messages').innerHTML += '<p style="color:red">연결 해제</p>';
            }
        }

        function sendMessage() {
            let content = document.getElementById('message').value;
            stompClient.send("/pub/chat/message", {}, JSON.stringify({
                type: 'TALK',
                roomId: document.getElementById('roomId').value,
                senderId: document.getElementById('senderId').value,
                senderName: document.getElementById('senderName').value,
                content: content
            }));
            document.getElementById('message').value = '';
        }
    </script>
</body>
</html>
